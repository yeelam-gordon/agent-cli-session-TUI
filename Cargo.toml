[package]
name = "agent-session-tui"
version = "0.3.2"
edition = "2021"
description = "Terminal UI for managing AI agent CLI sessions — GitHub Copilot, Claude Code, OpenAI Codex, Qwen, Google Gemini"
license = "MIT"
repository = "https://github.com/yeelam-gordon/agent-cli-session-TUI"
homepage = "https://github.com/yeelam-gordon/agent-cli-session-TUI"
documentation = "https://github.com/yeelam-gordon/agent-cli-session-TUI#readme"
readme = "README.md"
keywords = ["tui", "agent", "cli", "copilot", "session-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# TUI — crossterm backend only, no extras
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["windows", "events"] }

# Async runtime — only channels, timers, spawn
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

# Config & serialization
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
anyhow = "1"
unicode-width = "0.2"
libloading = "0.9.0"
uuid = { version = "1", default-features = false, features = ["v4", "fast-rng"] }

# HTTP client for the remote grouping engine (src/grouping/remote.rs).
# `native-tls` deliberately over `rustls`: it uses the OS TLS stack (schannel /
# Security.framework / openssl). Measured in an isolated probe crate with this
# same release profile, the HTTP stack cost +445 KB over a serde-only baseline
# vs +1.26 MB for rustls — and native-tls avoids pulling in `ring`, whose build
# needs a C toolchain (it fails outright on the windows-gnu toolchain).
ureq = { version = "3", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Full-text search over session logs (Lucene-like, MIT-licensed)
tantivy = { version = "0.22", default-features = false, features = ["mmap", "stopwords"] }

# Agent Client Protocol — JSON-RPC client over stdio. Currently unused at runtime
# (we still use `-p` non-interactive mode in src/acp.rs); reserved for the v0.4
# migration that will spawn the agent once and reuse the connection across
# grouping batches.
agent-client-protocol = "0.11.1"
agent-client-protocol-tokio = "0.11.1"

# Process info — disable disk/network/component/user, keep only process lookup
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system", "windows"] }
windows = { version = "0.62", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(unix)'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"       # Optimize for size
lto = "thin"          # Thin LTO — fast builds, good size reduction
codegen-units = 4     # Parallel codegen
strip = true          # Strip debug symbols
panic = "abort"       # No unwind tables
