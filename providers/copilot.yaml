# Copilot CLI provider — v3 YAML (parse-time sugar over internal schema).
#
# v3 surface collapses the old split between discovery/fields/liveness/tab_title
# blocks into a single `extract:` contract plus a tiny `process:` block. Every
# field declares its source via `from:` (metadata | events | dirname | cwd),
# so strategy boilerplate (`strategy: metadata_field`, `strategy:
# first_matching_event`) disappears. Downstream code sees the same internal
# ProviderConfigFile regardless of v2/v3 source.
#
# On-disk layout (~/.copilot/session-state/<UUID>/):
#   - workspace.yaml     — session metadata (cwd, summary)
#   - events.jsonl       — append-only event stream
#   - inuse.<PID>.lock   — per-process live-lock file(s)

name: copilot
display_name: Copilot

capabilities:
  supports_resume: true
  supports_discovery: true
  supports_logs: true
  supports_wait_detection: true
  supports_kill: true
  supports_archive: true
  supports_summary_extraction: true

files:
  metadata: workspace.yaml
  events: events.jsonl

discovery:
  base_dir: ${HOME}/.copilot/session-state
  strategy: dir_per_session
  tail_bytes: 2097152

extract:
  session_id:
    from: dirname

  cwd:
    from: metadata
    path: cwd

  title:
    from: metadata
    path: summary
    transforms: [strip_newlines, trim, "truncate:60"]
    fallback:
      - from: events
        where: 'type == "user.message"'
        path: data.content // data.message // data.text
        transforms: [strip_newlines, trim, "truncate:60"]

  summary:
    from: metadata
    path: summary
    transforms: [trim, "truncate:500"]

  summary_parts:
    - name: first_user
      label: "── First message ──"
      spec:
        from: events
        where: 'type == "user.message"'
        path: data.content // data.message // data.text
        transforms: [trim, "truncate:2000"]
    - name: last_user
      label: "── Last user message ──"
      skip_if_same_as: first_user
      spec:
        from: events
        strategy: last_matching_event
        where: 'type == "user.message"'
        path: data.content // data.message // data.text
        transforms: [trim, "truncate:2000"]
    - name: prev_assistant
      label: "── Previous response ──"
      spec:
        from: events
        strategy: nth_from_end_matching_event
        where: 'type == "assistant.message" and data.content != null and data.content != "" and (not data.toolRequests or len(data.content) > 100)'
        nth: 2
        path: data.content // data.message // data.text
        transforms: [trim, "truncate:2000"]
    - name: last_assistant
      label: "── Last Copilot response ──"
      spec:
        from: events
        strategy: last_matching_event
        where: 'type == "assistant.message" and data.content != null and data.content != "" and (not data.toolRequests or len(data.content) > 100)'
        path: data.content // data.message // data.text
        transforms: [trim, "truncate:2000"]

  created_at:
    from: events
    strategy: first_event_field
    path: timestamp
    fallback:
      - from: file
        strategy: file_mtime

  updated_at:
    from: file
    strategy: file_mtime

  state:
    from: events
    last_event_map:
      "assistant.turn_start":    busy
      "assistant.turn_end":      waiting
      "assistant.turn_complete": waiting
      "session.task_complete":   waiting
      "user.message":            busy
      "tool.execution_start":    busy
      "tool.execution_complete": busy
    idle_threshold_seconds: 1800

  tab_title:
    from: events
    strategy: from_tool_call
    where: 'type == "assistant.message"'
    iterate_path: data.toolRequests
    tool_name_path: name
    tool_name: report_intent
    args_path: arguments
    arg_field: intent

process:
  match:
    field: lockfile
    on: lockfile
    pattern: "inuse.*.lock"
    pid_regex: 'inuse\.(\d+)\.lock'
